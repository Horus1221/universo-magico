<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0,user-scalable=no">
  <meta name="theme-color" content="#050713">
  <title>Universo Mágico — El Trono Caído</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<!-- =====================================================
     PANTALLA PRINCIPAL
===================================================== -->

<section id="home">

  <!-- ESCENARIO FANTÁSTICO -->
  <div class="magic-bg">

    <!-- Fondo -->
    <div class="fantasy-scene"></div>

    <!-- Capa oscura para que el menú se lea -->
    <div class="scene-overlay"></div>

    <!-- Luna / iluminación -->
    <div class="magic-light"></div>

    <!-- Niebla -->
    <div class="fog fog-one"></div>
    <div class="fog fog-two"></div>
    <div class="fog fog-three"></div>

    <!-- Partículas -->
    <div class="particles">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Brillos mágicos -->
    <div class="magic-orb orb-one"></div>
    <div class="magic-orb orb-two"></div>
    <div class="magic-orb orb-three"></div>

  </div>


  <!-- =================================================
       LOGO
  ================================================== -->

  <div class="home-content">

    <div class="logo">

      <div class="logo-small">
        UNIVERSO
      </div>

      <h1>MÁGICO</h1>

      <div class="logo-subtitle">
        EL TRONO CAÍDO
      </div>

    </div>


    <!-- =================================================
         ACCESO
    ================================================== -->

    <div class="auth-card">

      <div class="auth-tabs">

        <button
          id="tabLogin"
          class="auth-tab active"
          type="button">
          INICIAR SESIÓN
        </button>

        <button
          id="tabRegister"
          class="auth-tab"
          type="button">
          CREAR CUENTA
        </button>

      </div>


      <div class="auth-heading">

        <h2 id="authTitle">
          Bienvenido al Reino
        </h2>

        <p id="authDescription">
          Tu historia comienza aquí
        </p>

      </div>


      <form id="authForm">

        <div class="input-group">

          <label for="username">
            NOMBRE
          </label>

          <input
            id="username"
            type="text"
            autocomplete="username"
            placeholder="Escribe tu nombre"
            maxlength="20"
            required>

        </div>


        <div class="input-group">

          <label for="password">
            CONTRASEÑA
          </label>

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Escribe tu contraseña"
            required>

        </div>


        <button
          id="authSubmit"
          type="submit">

          ENTRAR AL UNIVERSO

        </button>

        <div id="authMsg"></div>

      </form>


      <div class="realm-status">
        <span class="status-dot"></span>
        REINO ONLINE
      </div>

    </div>


    <div class="version">
      EL TRONO CAÍDO · 1.0
    </div>

  </div>

</section>



<!-- =====================================================
     JUEGO
===================================================== -->

<section id="game" hidden>

  <div id="scene"></div>


  <!-- HUD SUPERIOR -->

  <div class="game-hud">

    <div class="player-info">

      <div id="avatar">
        A
      </div>

      <div>
        <strong id="hudName">
          Aventurero
        </strong>

        <div class="hp-bar">
          <span></span>
        </div>

        <div class="mana-bar">
          <span></span>
        </div>

      </div>

    </div>


    <button id="mapBtn">
      MAPA
    </button>

  </div>


  <!-- BOTONES LATERALES -->

  <div class="side-buttons">

    <button id="sideMap">
      MAPA
    </button>

    <button id="enterHouse" hidden>
      ENTRAR
    </button>

  </div>


  <!-- JOYSTICK -->

  <div id="joystick">
    <div id="stick"></div>
  </div>


  <!-- COMBATE -->

  <div class="combat">

    <button data-spell="attack">
      ATAQUE
    </button>

    <button data-spell="fire">
      FUEGO
    </button>

    <button data-spell="water">
      AGUA
    </button>

    <button data-spell="arcane">
      ARCANO
    </button>

  </div>


  <!-- CHAT -->

  <div id="chat">

    <button id="chatToggle">
      CHAT
    </button>

    <div id="msgs"></div>

    <form id="form">

      <input
        id="input"
        type="text"
        autocomplete="off"
        placeholder="Escribí un mensaje...">

    </form>

  </div>


  <!-- MAPA -->

  <div id="map" hidden>

    <div class="map-window">

      <button id="closeMap">
        CERRAR
      </button>

      <h2>MAPA DEL REINO</h2>

      <div class="map-content">
        UNIVERSO MÁGICO
      </div>

    </div>

  </div>

</section>


<!-- =====================================================
     LIBRERÍAS
===================================================== -->

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/game.js"></script>

</body>
</html>
