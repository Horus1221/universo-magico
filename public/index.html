<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05030d">
  <title>Universo Mágico — El Trono Caído</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ==============================
       PANTALLA DE INICIO
       ============================== -->

  <section id="home">

    <div class="magic-bg">

      <div class="moon"></div>

      <div class="magic-orb orb1"></div>
      <div class="magic-orb orb2"></div>
      <div class="magic-orb orb3"></div>

      <!-- Partículas mágicas -->
      <span class="spark s1">✦</span>
      <span class="spark s2">✧</span>
      <span class="spark s3">✦</span>
      <span class="spark s4">✧</span>
      <span class="spark s5">✦</span>
      <span class="spark s6">✧</span>
      <span class="spark s7">✦</span>
      <span class="spark s8">✧</span>

      <!-- Niebla -->
      <div class="mist mist1"></div>
      <div class="mist mist2"></div>
      <div class="mist mist3"></div>

    </div>


    <div class="home-content">

      <!-- LOGO -->

      <div class="logo">

        <div class="logo-symbol">✦</div>

        <div class="logo-small">
          UNIVERSO
        </div>

        <h1>
          MÁGICO
        </h1>

        <div class="logo-line"></div>

        <div class="trono">
          EL TRONO CAÍDO
        </div>

      </div>


      <!-- LOGIN -->

      <div class="auth-card">

        <div class="auth-tabs">

          <button
            id="tabLogin"
            class="auth-tab active"
            type="button">
            INICIAR SESIÓN
          </button>

          <button
            id="tabRegister"
            class="auth-tab"
            type="button">
            CREAR CUENTA
          </button>

        </div>


        <div class="auth-title">
          <span>✦</span>
          Bienvenido al Reino
          <span>✦</span>
        </div>

        <p class="auth-description">
          Tu historia comienza aquí
        </p>


        <form id="authForm">

          <!-- NOMBRE -->

          <div class="input-group">

            <label>
              NOMBRE
            </label>

            <input
              id="username"
              type="text"
              placeholder="Escribe tu nombre"
              autocomplete="username"
              maxlength="20"
              required>

          </div>


          <!-- CONTRASEÑA -->

          <div class="input-group">

            <label>
              CONTRASEÑA
            </label>

            <input
              id="password"
              type="password"
              placeholder="Escribe tu contraseña"
              autocomplete="current-password"
              required>

          </div>


          <!-- MENSAJE DE ERROR -->

          <div
            id="authMsg"
            class="auth-message">
          </div>


          <!-- ENTRAR -->

          <button
            id="authSubmit"
            class="enter-button"
            type="submit">

            ✦ ENTRAR AL UNIVERSO ✦

          </button>

        </form>


        <!-- ESTADO -->

        <div class="realm-status">

          <span></span>

          REINO ONLINE

        </div>

      </div>


      <div class="version">
        EL TRONO CAÍDO · 1.0
      </div>

    </div>

  </section>



  <!-- ==============================
       JUEGO
       ============================== -->

  <section id="game" hidden>

    <header>

      <strong>
        ✦ UNIVERSO MÁGICO
      </strong>

      <span>
        RONDA
        <b id="round">1</b>
      </span>

      <button id="menu">
        ☰
      </button>

    </header>


    <main>

      <aside>

        <h3>
          TU TRONO
        </h3>

        <div class="card">

          ♛
          <b>
            Guardián del Fuego
          </b>

        </div>

        <p>
          VIDA
          <b id="hp">100</b>
        </p>

        <p>
          ENERGÍA
          <b id="energy">6</b>/10
        </p>

        <button id="end">
          TERMINAR TURNO
        </button>

      </aside>


      <div id="scene">

        <div class="title">
          VALLE DE LOS CUATRO ELEMENTOS
        </div>

        <div class="actions">

          <button data-e="fire">
            FUEGO
          </button>

          <button data-e="water">
            AGUA
          </button>

          <button data-e="earth">
            TIERRA
          </button>

          <button data-e="air">
            AIRE
          </button>

        </div>

      </div>


      <aside class="chat">

        <nav>

          <b>
            CHAT
          </b>

          <b>
            EJÉRCITO
          </b>

        </nav>


        <div id="msgs"></div>


        <form id="form">

          <input
            id="input"
            placeholder="Escribe al reino..."
            maxlength="300">

          <button>
            ➤
          </button>

        </form>

      </aside>

    </main>

  </section>


  <!-- SOCKET.IO -->

  <script src="/socket.io/socket.io.js"></script>

  <!-- JUEGO -->

  <script
    type="module"
    src="game.js">
  </script>

</body>
</html>
