<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <title>Universo Mágico — El Trono Caído</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <!-- ==================================================
       PANTALLA DE INICIO
  =================================================== -->

  <main id="home">

    <div class="magic-bg"></div>

    <section class="auth-card">

      <div class="auth-tabs">

        <button
          id="tabLogin"
          class="auth-tab active"
          type="button"
        >
          ENTRAR
        </button>

        <button
          id="tabRegister"
          class="auth-tab"
          type="button"
        >
          CREAR CUENTA
        </button>

      </div>


      <div class="auth-content">

        <div class="auth-icon">
          ✨
        </div>

        <h2 id="authTitle">
          Bienvenido al Reino
        </h2>

        <p class="auth-description">
          Tu aventura comienza aquí.
        </p>


        <form id="authForm">

          <label for="username">
            Nombre del aventurero
          </label>

          <input
            id="username"
            name="username"
            type="text"
            placeholder="Tu nombre"
            autocomplete="username"
            maxlength="24"
            required
          >


          <label for="password">
            Contraseña
          </label>

          <input
            id="password"
            name="password"
            type="password"
            placeholder="Tu contraseña"
            autocomplete="current-password"
            required
          >


          <div
            id="authMsg"
            class="auth-message"
          ></div>


          <button
            id="authSubmit"
            class="main-button"
            type="submit"
          >
            ENTRAR AL UNIVERSO
          </button>

        </form>

      </div>

    </section>

  </main>


  <!-- ==================================================
       JUEGO
  =================================================== -->

  <main
    id="game"
    hidden
  >

    <div
      id="scene"
      class="scene"
    ></div>


    <!-- ==================================================
         HUD
    =================================================== -->

    <header class="hud">

      <div class="player-hud">

        <div
          id="avatar"
          class="avatar"
        >
          A
        </div>

        <div>

          <div
            id="playerName"
            class="player-name"
          >
            Aventurero
          </div>

          <div
            id="playerRace"
            class="player-race"
          >
            Humano
          </div>

        </div>

      </div>


      <div class="bars">

        <div class="bar hp">

          <span>❤️</span>

          <div class="bar-track">
            <div
              id="hpBar"
              class="bar-fill"
              style="width:100%"
            ></div>
          </div>

        </div>


        <div class="bar mana">

          <span>💧</span>

          <div class="bar-track">
            <div
              id="manaBar"
              class="bar-fill"
              style="width:100%"
            ></div>
          </div>

        </div>

      </div>


      <div class="hud-buttons">

        <button
          id="mapButton"
          class="hud-button"
          type="button"
        >
          🗺️
        </button>

      </div>

    </header>


    <!-- ==================================================
         CREADOR DE PERSONAJE
    =================================================== -->

    <section
      id="characterCreator"
      class="character-creator"
      hidden
    >

      <div class="creator-card">

        <div class="creator-title">
          ✨ CREA TU AVENTURERO
        </div>

        <div class="creator-subtitle">
          Elegí tu raza para comenzar tu aventura
        </div>


        <div class="race-grid">

          <button
            class="race-button"
            data-race="Humano"
            type="button"
          >
            <span class="race-icon">🧑</span>
            <strong>Humano</strong>
            <small>Equilibrado y adaptable</small>
          </button>


          <button
            class="race-button"
            data-race="Elfo"
            type="button"
          >
            <span class="race-icon">🧝</span>
            <strong>Elfo</strong>
            <small>Ágil y conectado con la naturaleza</small>
          </button>


          <button
            class="race-button"
            data-race="Enano"
            type="button"
          >
            <span class="race-icon">⛏️</span>
            <strong>Enano</strong>
            <small>Resistente y poderoso</small>
          </button>


          <button
            class="race-button"
            data-race="Orco"
            type="button"
          >
            <span class="race-icon">👹</span>
            <strong>Orco</strong>
            <small>Fuerte y feroz</small>
          </button>


          <button
            class="race-button"
            data-race="Hada"
            type="button"
          >
            <span class="race-icon">🧚</span>
            <strong>Hada</strong>
            <small>Mágica y veloz</small>
          </button>


          <button
            class="race-button"
            data-race="Dracónido"
            type="button"
          >
            <span class="race-icon">🐉</span>
            <strong>Dracónido</strong>
            <small>Descendiente de dragones</small>
          </button>

        </div>


        <div class="appearance-section">

          <div class="appearance-title">
            APARIENCIA
          </div>

          <div class="appearance-options">

            <button
              class="appearance-button"
              type="button"
              data-appearance="cabello"
            >
              💇 Cabello
            </button>

            <button
              class="appearance-button"
              type="button"
              data-appearance="ropa"
            >
              👕 Ropa
            </button>

            <button
              class="appearance-button"
              type="button"
              data-appearance="accesorios"
            >
              💎 Accesorios
            </button>

          </div>

        </div>


        <button
          id="finishCharacter"
          class="main-button"
          type="button"
        >
          ✨ COMENZAR AVENTURA
        </button>

      </div>

    </section>


    <!-- ==================================================
         HABILIDADES
    =================================================== -->

    <section
      id="abilitiesPanel"
      class="abilities-panel"
    >

      <div class="abilities-title">
        <span>⚔️</span>
        <span id="abilityRace">Humano</span>
      </div>


      <div class="ability-list">

        <button
          id="ability0"
          class="ability-button"
          type="button"
        >
          Voluntad · 15 MP
        </button>

        <button
          id="ability1"
          class="ability-button"
          type="button"
        >
          Segundo aire · 20 MP
        </button>

        <button
          id="ability2"
          class="ability-button"
          type="button"
        >
          Adaptación · 25 MP
        </button>

      </div>

    </section>


    <!-- ==================================================
         JOYSTICK
    =================================================== -->

    <div
      id="joystick"
      class="joystick"
    >

      <div class="stick"></div>

    </div>


    <!-- ==================================================
         CHAT
    =================================================== -->

    <section
      id="chat"
      class="chat"
    >

      <button
        id="chatToggle"
        class="chat-toggle"
        type="button"
        aria-label="Ocultar chat"
      >
        ×
      </button>


      <div
        id="chatMessages"
        class="chat-messages"
      ></div>


      <form
        id="chatForm"
        class="chat-form"
      >

        <input
          id="chatInput"
          type="text"
          placeholder="Escribí un mensaje..."
          maxlength="180"
          autocomplete="off"
        >

        <button
          type="submit"
        >
          ➤
        </button>

      </form>

    </section>


    <!-- ==================================================
         MAPA
    =================================================== -->

    <aside
      id="sideMap"
      class="side-map"
    >

      <div class="map-header">

        <strong>
          🗺️ MAPA DEL REINO
        </strong>

        <button
          type="button"
          onclick="document.getElementById('sideMap').classList.remove('open')"
        >
          ×
        </button>

      </div>


      <div class="map-world">

        <div class="map-region village">
          🏘️
          <span>Aldea</span>
        </div>

        <div class="map-region forest">
          🌲
          <span>Bosque</span>
        </div>

        <div class="map-region lake">
          💧
          <span>Lago</span>
        </div>

        <div class="map-region mountains">
          ⛰️
          <span>Montañas</span>
        </div>

        <div class="map-region ruins">
          🏚️
          <span>Ruinas</span>
        </div>

        <div class="map-region castle">
          🏰
          <span>Castillo</span>
        </div>


        <div
          id="playerMarker"
          class="player-marker"
        >
          ●
        </div>

      </div>

    </aside>


    <!-- ==================================================
         CASA
    =================================================== -->

    <button
      id="enterHouse"
      class="house-button"
      type="button"
      hidden
    >
      🏠 Entrar
    </button>


    <button
      id="exitHouse"
      class="house-button"
      type="button"
      hidden
    >
      🚪 Salir
    </button>


    <!-- ==================================================
         MENSAJES
    =================================================== -->

    <div
      id="gameToast"
      class="game-toast"
    ></div>

  </main>


  <!-- ==================================================
       SOCKET.IO
  =================================================== -->

  <script src="/socket.io/socket.io.js"></script>

  <script
    type="module"
    src="/game.js"
  ></script>

</body>
</html>
